name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run relay:check

      # VITE_BASE matches the project page path. A user page or custom domain
      # would set this to /.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Set the repository variable LORAC_RELAY_URL after deploying
          # relay/. Empty means the build is solo only.
          VITE_RELAY_URL: ${{ vars.LORAC_RELAY_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
